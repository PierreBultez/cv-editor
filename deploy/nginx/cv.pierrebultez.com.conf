# CV Studio — cv.pierrebultez.com
#
# À déposer dans /etc/nginx/sites-available/, puis à lier dans sites-enabled/.
# Le bloc TLS est ajouté par Certbot ; on ne déclare ici que l'écoute en clair,
# que Certbot transformera lui-même en redirection vers HTTPS.

server {
    listen 80;
    listen [::]:80;

    server_name cv.pierrebultez.com www.cv.pierrebultez.com;

    # Laravel sert tout depuis public/ : la racine ne doit jamais pointer sur
    # /var/www/cv, sinon .env et le code deviennent téléchargeables.
    root /var/www/cv/public;
    index index.php;

    charset utf-8;

    # Les photos sont recadrées à 1024 px côté client (~300 Ko), mais la
    # validation serveur accepte jusqu'à 8 Mo. Sans cette directive, nginx
    # refuserait dès 1 Mo avec un 413 que l'interface ne saurait pas expliquer.
    client_max_body_size 10M;

    access_log /var/log/nginx/cv.pierrebultez.com.access.log;
    error_log  /var/log/nginx/cv.pierrebultez.com.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets versionnés par Vite : le nom de fichier change à chaque build,
    # ils peuvent donc être mis en cache indéfiniment.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Polices auto-hébergées, également empreintées par le build.
    location ~* \.(woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Photos des CV, servies via le lien symbolique public/storage.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Le pipeline photo (redimensionnement + 4 encodages) reste bien en
        # deçà, mais la marge évite un 504 sur une image inhabituelle.
        fastcgi_read_timeout 60s;
    }

    # Rien d'autre que index.php ne doit être exécuté, et les fichiers cachés
    # ne doivent pas être servis (.env, .git, …).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # En-têtes de sécurité. Pas de CSP stricte ici : les pages publiques ne
    # chargent aucune ressource tierce, mais Vite injecte des styles en ligne.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
